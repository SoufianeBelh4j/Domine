version: '3.8'

services:
  module1:
    build:
      context: ./module1
    container_name: module1
    ports:
      - "5000:5000"

  module2:
    build:
      context: ./module2
    container_name: module2
    ports:
      - "5001:5001"

  module3:
    build:
      context: ./module3
    container_name: module3
    ports:
      - "5002:5002"

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - module1
      - module2
      - module3
